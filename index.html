<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/media-queries.css">
    <link rel="shortcut icon" href="favicon.svg" type="image/x-icon">
    <title>Login</title>
</head>
<body>
    <main>
        <section id="asset"></section>
        <section id="content">
            <h1>Welcome,<br>let's log you in!</h1>
            <p>Keep with you the movies and TV shows you've watched and bring them to whatever you go.</p>
            <form action="">
                <div class="input">
                    <input type="email" autocomplete="email" name="email" placeholder="Email" required aria-label="Insert your email">
                </div>
                <div class="input">
                    <input type="password" autocomplete="current-password" name="password" placeholder="Password" required aria-label="Insert your password" minlength="8">
                </div>
                <div class="action-bar">
                    <button class="button primary" type="submit">Login</button>
                    <button class="button secondary">Forgot password</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
